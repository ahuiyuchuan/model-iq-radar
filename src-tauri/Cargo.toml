[package]
name = "model-probe"
version = "1.0.5"
description = "自定义题目与连续字符串规则的桌面测智雷达"
authors = ["ahui"]
license = "GPL-3.0-only"
repository = "https://github.com/ahuiyuchuan/model-iq-radar"
edition = "2021"
rust-version = "1.85"

# 生产构建只嵌入前端静态资源；不包含本地测试服务或开发工具。
[lib]
name = "model_probe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["time", "macros", "sync"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
semver = "1"
sha2 = "0.10"
regex = "1"
# 只允许加密 SMTP；异步发送不占用测试门禁，凭据由 Windows keyring 单独保存。
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }

[dev-dependencies]
# 虚拟时钟验证小时级检查与失败节流，不在测试中联网或真实等待一小时。
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
# 复用 Windows 注册表安全封装；仅用户主动切换时修改本程序的当前用户启动项。
windows-registry = "0.6.1"
# 只为既有主 WebView 安装 iframe 导航保护，不创建原生预览窗口。
webview2-com = "=0.39.1"
windows = "=0.62.2"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "unwind"
