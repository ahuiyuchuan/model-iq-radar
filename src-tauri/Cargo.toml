[package]
name = "model-probe"
version = "1.0.0"
description = "自定义题目与连续字符串规则的桌面测智雷达"
authors = ["ahui"]
license = "GPL-3.0-only"
repository = "https://github.com/ahuiyuchuan/model-iq-radar"
edition = "2021"
rust-version = "1.85"

# 生产构建只嵌入前端静态资源；不包含本地测试服务或开发工具。
[lib]
name = "model_probe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["time", "macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
semver = "1"

[target.'cfg(windows)'.dependencies]
# 复用 Windows 注册表安全封装；仅用户主动切换时修改本程序的当前用户启动项。
windows-registry = "0.6.1"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "unwind"
